spring.application.name=4iren-recommendation
spring.config.import=${CONFIG_SERVER_URL:optional:configserver:http://localhost:8888}
model.serving.enabled=${MODEL_SERVING_ENABLED:true}
model.serving.minio.endpoint=${MINIO_ENDPOINT:}
model.serving.minio.access-key=${MINIO_ACCESS_KEY:}
model.serving.minio.secret-key=${MINIO_SECRET_KEY:}
model.serving.minio.bucket=${MINIO_MODEL_BUCKET:4iren-models}
model.serving.minio.prefix=${MINIO_MODEL_PREFIX:versions/v1}
model.serving.cache-directory=${MODEL_BUNDLE_CACHE_DIRECTORY:}
